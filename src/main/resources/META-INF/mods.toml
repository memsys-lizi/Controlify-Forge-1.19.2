modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/isXander/Controlify/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}

This is an unofficial port of Controlify 1.2.1 (Fabric 1.19.4) to Forge 1.19.2.
Original work by isXander, licensed under the GNU Lesser General Public License v3.0 or later.
The original copyright is retained. This port does not change the license.'''
logoFile="icon.png"
displayURL="https://github.com/isXander/Controlify"

[[mixins]]
config="controlify.mixins.json"

[[dependencies.${mod_id}]]
    modId="mixinextras"
    mandatory=true
    versionRange="[0.2.0-beta.8,0.3.0)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
